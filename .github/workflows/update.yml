name: Update Nodes

on:
  schedule:
    - cron: "0 */8 * * *"

  workflow_dispatch:


permissions:
  contents: write


jobs:

  update:

    runs-on: ubuntu-latest


    steps:


    - name: Checkout
      uses: actions/checkout@v4



    - name: Install environment
      run: |

        pip install requests pyyaml

        wget -q https://github.com/SagerNet/sing-box/releases/download/v1.12.0/sing-box-1.12.0-linux-amd64.tar.gz

        tar -xzf sing-box-1.12.0-linux-amd64.tar.gz

        sudo mv sing-box-1.12.0-linux-amd64/sing-box /usr/local/bin/sing-box

        chmod +x /usr/local/bin/sing-box

        sing-box version



    - name: Run checker
      run: |

        python checker.py



    - name: Save result
      run: |

        git config user.name github-actions

        git config user.email github-actions@github.com


        git add nodes.txt sub.txt


        git commit -m "update alive nodes" || true


        git push
