name: Update Nodes

on:
  schedule:
    - cron: "0 */8 * * *"

  workflow_dispatch:


permissions:
  contents: write


jobs:

  update:

    runs-on: ubuntu-latest


    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Install Python
      run: |
        pip install requests pyyaml


    - name: Run checker
      run: |
        python checker.py


    - name: Save files
      run: |

        git config user.name github-actions

        git config user.email github-actions@github.com

        git add nodes.txt sub.txt

        git commit -m "update nodes" || true

        git push
